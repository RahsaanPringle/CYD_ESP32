<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CYD Blog</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <header class="site-header py-4 mb-4">
      <div class="container">
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3"
        >
          <div>
            <p class="eyebrow mb-1">Content you can manage</p>
            <h1 class="display-5 fw-bold mb-1">CYD Blog</h1>
            <p class="lead mb-0">
              Browse posts by category and month, or publish something new.
            </p>
          </div>
          <button
            id="new-post-button"
            class="btn btn-light fw-semibold"
            type="button"
          >
            New post
          </button>
        </div>
      </div>
    </header>

    <main class="container pb-5">
      <section id="post-browser" aria-labelledby="published-posts-heading">
        <div
          class="d-flex flex-column flex-xl-row justify-content-between align-items-xl-end gap-3 mb-3"
        >
          <div>
            <h2 id="published-posts-heading" class="h3 mb-1">
              Published posts
            </h2>
            <p
              id="data-status"
              class="text-secondary mb-0"
              role="status"
              aria-live="polite"
            >
              Loading...
            </p>
          </div>
          <div class="d-flex flex-wrap align-items-end gap-2 filter-controls">
            <div>
              <label
                class="form-label small fw-semibold mb-1"
                for="category-filter"
                >Category</label
              >
              <select
                id="category-filter"
                class="form-select form-select-sm"
                aria-label="Filter posts by category"
              >
                <option value="*">All categories</option>
              </select>
            </div>
            <div>
              <label
                class="form-label small fw-semibold mb-1"
                for="month-filter"
                >Month</label
              >
              <select
                id="month-filter"
                class="form-select form-select-sm"
                aria-label="Filter posts by month"
              >
                <option value="*">All months</option>
              </select>
            </div>
            <div>
              <label class="form-label small fw-semibold mb-1" for="sort-posts"
                >Order</label
              >
              <select
                id="sort-posts"
                class="form-select form-select-sm"
                aria-label="Sort posts"
              >
                <option value="date-desc">Newest first</option>
                <option value="date-asc">Oldest first</option>
                <option value="category">Category</option>
              </select>
            </div>
            <button
              id="refresh-button"
              class="btn btn-outline-primary btn-sm"
              type="button"
            >
              Refresh
            </button>
          </div>
        </div>

        <div
          id="active-filters"
          class="small text-secondary mb-3"
          aria-live="polite"
        ></div>
        <div id="post-grid" class="row g-3" aria-label="Blog post grid"></div>
        <div id="empty-filter-state" class="empty-state d-none" role="status">
          No posts match the selected filters.
        </div>
      </section>

      <section
        id="post-detail"
        class="card detail-card d-none mt-4"
        aria-labelledby="detail-title"
      >
        <div class="card-body p-4 p-lg-5">
          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-3 mb-3"
          >
            <div>
              <div id="detail-meta" class="post-meta mb-2"></div>
              <h2 id="detail-title" class="display-6 fw-bold mb-0"></h2>
            </div>
            <div class="d-flex gap-2">
              <button
                id="back-to-grid-button"
                class="btn btn-outline-secondary"
                type="button"
              >
                Back to posts
              </button>
              <button
                id="edit-post-button"
                class="btn btn-primary"
                type="button"
              >
                Edit post
              </button>
            </div>
          </div>
          <div id="detail-content" class="rich-content"></div>
        </div>
      </section>

      <section
        id="editor-panel"
        class="card editor-card d-none mt-4"
        aria-labelledby="editor-heading"
      >
        <div class="card-body p-4 p-lg-5">
          <div
            class="d-flex justify-content-between align-items-start gap-3 mb-3"
          >
            <div>
              <p id="editor-mode-label" class="eyebrow text-primary mb-1">
                New post
              </p>
              <h2 id="editor-heading" class="h3 mb-0">Write a blog post</h2>
            </div>
            <button
              id="cancel-edit-button"
              class="btn-close"
              type="button"
              aria-label="Close editor"
            ></button>
          </div>

          <form id="blog-form">
            <input id="editing-index" type="hidden" value="" />
            <div class="row g-3">
              <div class="col-12 col-lg-7">
                <label class="form-label fw-semibold" for="title"
                  >Post title</label
                >
                <input
                  id="title"
                  name="title"
                  class="form-control"
                  required
                  maxlength="120"
                  autocomplete="off"
                />
              </div>
              <div class="col-12 col-sm-6 col-lg-5">
                <label class="form-label fw-semibold" for="category"
                  >Category</label
                >
                <input
                  id="category"
                  name="category"
                  class="form-control"
                  required
                  maxlength="60"
                  autocomplete="off"
                  list="category-suggestions"
                />
                <datalist id="category-suggestions"></datalist>
              </div>
              <div class="col-12 col-sm-6 col-lg-5">
                <label class="form-label fw-semibold" for="post-date"
                  >Post date</label
                >
                <input
                  id="post-date"
                  name="postDate"
                  class="form-control"
                  type="datetime-local"
                  required
                />
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold" for="content-editor"
                  >Post content</label
                >
                <div
                  class="editor-toolbar"
                  role="toolbar"
                  aria-label="Text formatting"
                >
                  <button
                    class="btn btn-sm btn-light"
                    type="button"
                    data-command="bold"
                    aria-label="Bold"
                    title="Bold"
                  >
                    <strong>B</strong>
                  </button>
                  <button
                    class="btn btn-sm btn-light"
                    type="button"
                    data-command="italic"
                    aria-label="Italic"
                    title="Italic"
                  >
                    <em>I</em>
                  </button>
                  <button
                    class="btn btn-sm btn-light"
                    type="button"
                    data-command="underline"
                    aria-label="Underline"
                    title="Underline"
                  >
                    <u>U</u>
                  </button>
                  <button
                    class="btn btn-sm btn-light"
                    type="button"
                    data-command="insertUnorderedList"
                    aria-label="Bulleted list"
                    title="Bulleted list"
                  >
                    &#8226; List
                  </button>
                  <button
                    class="btn btn-sm btn-light"
                    type="button"
                    data-command="insertOrderedList"
                    aria-label="Numbered list"
                    title="Numbered list"
                  >
                    1. List
                  </button>
                  <button
                    id="link-button"
                    class="btn btn-sm btn-light"
                    type="button"
                    aria-label="Add link"
                    title="Add link"
                  >
                    Link
                  </button>
                </div>
                <div
                  id="content-editor"
                  class="rich-editor"
                  contenteditable="true"
                  role="textbox"
                  aria-multiline="true"
                  aria-required="true"
                  data-placeholder="Write your post..."
                ></div>
              </div>
            </div>

            <div class="d-flex flex-wrap align-items-center gap-2 mt-3">
              <button id="save-button" class="btn btn-primary" type="submit">
                Publish post
              </button>
              <button
                id="cancel-button"
                class="btn btn-outline-secondary"
                type="button"
              >
                Cancel
              </button>
              <span
                id="status"
                class="small text-secondary ms-sm-2"
                role="status"
                aria-live="polite"
              ></span>
            </div>
          </form>
        </div>
      </section>

      <details class="mt-4">
        <summary class="fw-semibold">JSON preview</summary>
        <pre id="preview" class="mt-2">No posts saved yet.</pre>
      </details>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
